
name: Wisecow CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wisecow:latest
            ${{ secrets.DOCKER_USERNAME }}/wisecow:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1

      - name: Install NGINX Ingress Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.14.3/deploy/static/provider/kind/deploy.yaml

          kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx --timeout=300s

      - name: Generate TLS certificate
        run: |
          openssl req -x509 -nodes -days 365 \
            -newkey rsa:2048 \
            -keyout tls.key \
            -out tls.crt \
            -subj "/CN=wisecow.local" \
            -addext "subjectAltName=DNS:wisecow.local"

      - name: Create Kubernetes TLS secret
        run: |
          kubectl create secret tls wisecow-tls \
            --cert=tls.crt \
            --key=tls.key

      - name: Deploy Wisecow application
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

          kubectl set image deployment/wisecow-deployment \
            '*=mohanapriyaarumugam/wisecow:${{ github.sha }}'

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/wisecow-deployment --timeout=180s
          kubectl get pods
          kubectl get services

      - name: Configure Ingress
        run: |
          kubectl apply -f ingress.yaml
          kubectl get ingress

      - name: Verify HTTPS application
        run: |
          kubectl port-forward -n ingress-nginx \
            service/ingress-nginx-controller 8443:443 &

          curl --fail \
            --retry 15 \
            --retry-all-errors \
            --retry-delay 3 \
            --max-time 15 \
            --cacert tls.crt \
            --resolve wisecow.local:8443:127.0.0.1 \
            https://wisecow.local:8443/

      - name: Clean up TLS files
        if: always()
        run: rm -f tls.key tls.crt
